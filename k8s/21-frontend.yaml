# The only public entry point: a GCP external load balancer in front of the
# nginx pods, which serve the React app and route /api to the services:
# /api/auth and /api/admin -> auth, /api/ops -> ops, everything else -> backend.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: orbitops
spec:
  type: LoadBalancer
  # Keep the visitor's real IP (instead of a node's) so the admin page shows
  # where each sign-in came from.
  externalTrafficPolicy: Local
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: orbitops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: frontend } }
      containers:
        - name: frontend
          image: australia-southeast1-docker.pkg.dev/PROJECT_ID/orbitops/frontend:v1
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: orbitops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
