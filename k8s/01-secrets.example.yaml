# Copy to secrets.yaml (git-ignored), fill in real values, then apply it.
# Never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: orbitops-secrets
  namespace: orbitops
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me
  MYSQL_PASSWORD: change-me-too
  GEMINI_API_KEY: ""
  # The admin account, created at startup; sign in with these to see the admin page.
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: change-me-admin
  # Optional Google Custom Search (agent's third tool); leave blank to skip it.
  GOOGLE_API_KEY: ""
  GOOGLE_CSE_ID: ""
