# Shared rate-limit counters. Losing them on restart is harmless, so no disk.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: orbitops
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: orbitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
