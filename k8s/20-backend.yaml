# Chat service: chat, history, uploads, docs and web answers. The part that
# does the heavy lifting, so it is the one the HPA scales (30-hpa.yaml).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: orbitops
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: orbitops
spec:
  replicas: 2
  revisionHistoryLimit: 5            # keeps old versions around for `rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0              # never drop below current capacity mid-update
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # The chat pods handle untrusted user input, so they get no Kubernetes
      # API access at all; cluster questions go to the ops service.
      automountServiceAccountToken: false
      # Spread replicas over different nodes, so losing one node never takes
      # every chat pod down at once (see the node-failure demo in DEPLOY.md).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: backend } }
      containers:
        - name: backend
          # Replace PROJECT_ID (and region) with yours; see DEPLOY.md.
          image: australia-southeast1-docker.pkg.dev/PROJECT_ID/orbitops/backend:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: orbitops-config }
          env:
            - name: APP_VERSION
              value: v1
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: MYSQL_PASSWORD } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: GEMINI_API_KEY } }
            - name: GOOGLE_API_KEY
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: GOOGLE_API_KEY } }
            - name: GOOGLE_CSE_ID
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: GOOGLE_CSE_ID } }
          resources:
            # The embedding model + torch need ~1GB.
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
          startupProbe:
            # Startup loads the embedding model (baked into the image) and
            # waits for MySQL, so allow up to 3 min before liveness applies.
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 20
---
# Voluntary disruptions (kubectl drain, GKE node upgrades) must leave at
# least one chat pod running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: orbitops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
