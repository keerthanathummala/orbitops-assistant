apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: orbitops
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: orbitops
spec:
  replicas: 2
  revisionHistoryLimit: 5            # keeps old versions around for `rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0              # never drop below current capacity mid-update
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: orbitops-backend   # read-only cluster access, see 22-rbac.yaml
      containers:
        - name: backend
          # Replace PROJECT_ID (and region) with yours; see DEPLOY.md.
          image: australia-southeast1-docker.pkg.dev/PROJECT_ID/orbitops/backend:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: orbitops-config }
          env:
            - name: APP_VERSION
              value: v1
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: MYSQL_PASSWORD } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: GEMINI_API_KEY } }
            - name: GOOGLE_API_KEY
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: GOOGLE_API_KEY } }
            - name: GOOGLE_CSE_ID
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: GOOGLE_CSE_ID } }
            - name: ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: ADMIN_USERNAME, optional: true } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: orbitops-secrets, key: ADMIN_PASSWORD, optional: true } }
          resources:
            # The embedding model + torch need ~1GB.
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 36       # up to 3 min to load models and reach MySQL
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 20
