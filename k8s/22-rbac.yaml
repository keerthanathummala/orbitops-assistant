# AIOps: lets the ops service read (never change) the state of its own
# namespace -- pods, logs, events, deployments, autoscalers -- for the
# cluster questions and the health check (backend/app/cluster_ops.py).
# Only the ops pods run under this account (24-ops.yaml); the chat, auth
# and frontend pods have no Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbitops-ops
  namespace: orbitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbitops-observer
  namespace: orbitops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbitops-ops-observer
  namespace: orbitops
subjects:
  - kind: ServiceAccount
    name: orbitops-ops
    namespace: orbitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbitops-observer
