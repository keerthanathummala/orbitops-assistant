# Installed as a template: at start-up the nginx image fills in ${...} from
# the environment (defaults in the Dockerfile; 21-frontend.yaml overrides the
# upstreams with full Kubernetes DNS names). $name variables are nginx's own.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are capped at 5MB by the backend; allow a little headroom.
    client_max_body_size 6m;

    # Look the services up when a request comes in, not once at start-up:
    # nginx no longer refuses to start if a Service doesn't exist yet, and it
    # follows a container or Service that comes back with a new address.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $auth_upstream http://${AUTH_UPSTREAM};
    set $ops_upstream http://${OPS_UPSTREAM};
    set $chat_upstream http://${CHAT_UPSTREAM};

    # The browser only ever talks to this nginx, so CORS isn't involved.
    # It routes each part of the API to its own service. Only /api/ is
    # proxied, so the services' /internal/ endpoints, which they use to call
    # each other, can't be reached from outside.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The auth service records this address in the admin's sign-in history.
    proxy_set_header X-Real-IP $remote_addr;

    location /api/auth/ {
        proxy_pass $auth_upstream;
    }

    location /api/admin/ {
        proxy_pass $auth_upstream;
    }

    location /api/ops/ {
        proxy_pass $ops_upstream;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass $chat_upstream;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
