server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are capped at 5MB by the backend; allow a little headroom.
    client_max_body_size 6m;

    # The browser only ever talks to this nginx, so CORS isn't involved.
    # "backend" is the Kubernetes Service / compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend records this address in the admin's sign-in history.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
