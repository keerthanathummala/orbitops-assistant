server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are capped at 5MB by the backend; allow a little headroom.
    client_max_body_size 6m;

    # The browser only ever talks to this nginx, so CORS isn't involved.
    # It routes each part of the API to its own service ("auth", "ops" and
    # "backend" are the Kubernetes Service / compose service names). Only
    # /api/ is proxied, so the services' /internal/ endpoints, which they
    # use to call each other, can't be reached from outside.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The auth service records this address in the admin's sign-in history.
    proxy_set_header X-Real-IP $remote_addr;

    location /api/auth/ {
        proxy_pass http://auth:8000;
    }

    location /api/admin/ {
        proxy_pass http://auth:8000;
    }

    location /api/ops/ {
        proxy_pass http://ops:8000;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
